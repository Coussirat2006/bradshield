<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BradShield - Verificador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cartao">
        <h1>🛡️ BradShield</h1>
        <p>Verifique se o número de telefone é de um banco oficial.</p>
        
        <div class="area-busca">
            <input type="text" id="numeroInput" placeholder="Ex: 0800-591-2117">
            <button id="btnVerificar">Verificar</button>
        </div>

        <div id="resultado" class="escondido">
            <h2 id="statusTexto"></h2>
            <p id="mensagemTexto"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
